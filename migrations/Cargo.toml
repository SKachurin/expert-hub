[package]
name = "migration"
version = "0.1.0"
edition = "2021"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15"

[dependencies.sea-orm-migration]
version = "0.12"
default-features = false
features = ["runtime-tokio-native-tls", "sqlx-postgres"]