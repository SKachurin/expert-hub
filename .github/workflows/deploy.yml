name: Deploy Expert Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: expert-hub-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Upload production .env file
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$APP_DIR/.env' <<EOF
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          DATABASE_URL=${DATABASE_URL}
          RUST_LOG=${RUST_LOG}
          RUST_BACKTRACE=${RUST_BACKTRACE}
          HOST=${HOST}
          PORT=${PORT}
          TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          EOF"
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          APP_DIR: ${{ secrets.APP_DIR }}

          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          RUST_LOG: ${{ vars.RUST_LOG }}
          RUST_BACKTRACE: ${{ vars.RUST_BACKTRACE }}
          HOST: ${{ vars.HOST }}
          PORT: ${{ vars.PORT }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}

      - name: Run deploy script on server
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST"
            "export APP_DIR='$APP_DIR' BRANCH='${GITHUB_REF_NAME}' HEALTH_URL='http://127.0.0.1:8080/health' && bash /opt/deploy.sh"
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          APP_DIR: ${{ secrets.APP_DIR }}
