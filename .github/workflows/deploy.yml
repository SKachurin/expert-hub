name: Deploy Expert Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: expert-hub-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deploy script on server
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            export APP_DIR="${{ secrets.APP_DIR }}";
            export HEALTH_URL="http://127.0.0.1:8080/health";

            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}";
            export POSTGRES_DB="${{ secrets.POSTGRES_DB }}";
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}";
            export DATABASE_URL="${{ secrets.DATABASE_URL }}";

            export RUST_LOG="${{ secrets.RUST_LOG }}";
            export RUST_BACKTRACE="${{ secrets.RUST_BACKTRACE }}";
            export HOST="${{ secrets.HOST }}";
            export PORT="${{ secrets.PORT }}";

            export TELEGRAM_BOT_USERNAME="${{ secrets.TELEGRAM_BOT_USERNAME }}";
            export TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}";
            export TELEGRAM_DEV_BOT_TOKEN="${{ secrets.TELEGRAM_DEV_BOT_TOKEN }}";
          
            export GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}";
            export GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}";
            export GOOGLE_REDIRECT_URI="${{ secrets.GOOGLE_REDIRECT_URI }}";
          
            export TON_WORKER_BASE_URL="${{ secrets.TON_WORKER_BASE_URL }}";
            export TON_WORKER_AUTH_TOKEN="${{ secrets.TON_WORKER_AUTH_TOKEN }}";
            export TELEGRAM_WEBHOOK_SECRET_TOKEN="${{ secrets.TELEGRAM_WEBHOOK_SECRET_TOKEN }}";
          
            export PLATFORM_FEE_PERCENT="${{ secrets.PLATFORM_FEE_PERCENT }}";
            export TON_GAS_RESERVE="${{ secrets.TON_GAS_RESERVE }}";
            export TON_CONTROLLER_ACTION_RESERVE="${{ secrets.TON_CONTROLLER_ACTION_RESERVE }}";

            chmod +x /opt/deploy.sh;
            bash /opt/deploy.sh;
          '