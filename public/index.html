<!doctype html>
<html lang="en">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Auth demo</title>
<style>
    html,body{height:100%;margin:0;background:#000;color:#fff;font:16px/1.5 system-ui,Segoe UI,Roboto}
    .wrap{min-height:100%;display:grid;place-items:center;padding:24px}
    .card{background:#111;border-radius:18px;padding:28px 32px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
    .row{display:flex;align-items:center;gap:14px}
    .pic{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#222}
    .muted{opacity:.7}
</style>

<body>
<div class="wrap">
    <div class="card">
        <div id="content">
            <h1>Sign in with Telegram</h1>
            <p class="muted">We only need your public profile (name & photo).</p>
            <div id="tg-login"></div>
        </div>
    </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    (async () => {
        const BOT = 'expert_hub_bot'; // no @

        // 1) Mini App path (unchanged) …
        const wa = window.Telegram && window.Telegram.WebApp;
        const miniUser = wa?.initDataUnsafe?.user;
        if (miniUser) {
            renderUser({ first_name: miniUser.first_name, last_name: miniUser.last_name, photo_url: miniUser.photo_url });
            return;
        }

        // 2) Browser path — HARDCODE ORIGIN HERE
        const ORIGIN = 'https://uncategorical-interradially-dawson.ngrok-free.dev'; // must match BotFather /setdomain
        const hostEl = document.getElementById('tg-login');

        const iframe = document.createElement('iframe');
        iframe.src = `https://oauth.telegram.org/embed/${BOT}?origin=${encodeURIComponent(ORIGIN)}&request_access=write&embed=1`;
        iframe.width = 220;
        iframe.height = 54;
        iframe.style.border = '0';
        iframe.style.overflow = 'hidden';
        iframe.setAttribute('scrolling', 'no');
        hostEl.appendChild(iframe);

        // receive auth result …
        window.addEventListener('message', async (e) => {
            if (e.origin !== 'https://oauth.telegram.org') return;
            const payload = e.data;
            if (payload?.event === 'auth_result' && payload.result) {
                const r = await fetch('/tg-auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload.result),
                });
                if (!r.ok) return alert('Telegram login verification failed');
                const user = await r.json();
                renderUser(user);
            }
        });

        function renderUser(u) {
            document.getElementById('content').innerHTML =
                `<div class="row">
           <img class="pic" src="${u.photo_url || ''}" alt="">
           <div>
             <div style="font-size:20px;font-weight:600">${(u.first_name||'')+' '+(u.last_name||'')}</div>
             <div class="muted">${u.username ? '@'+u.username : ''}</div>
           </div>
         </div>`;
        }
    })();
</script>
</body>
</html>
