services:
  app:
    ports:
      - "127.0.0.1:8080:8080"
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RUST_LOG=${RUST_LOG}
      - RUST_BACKTRACE=${RUST_BACKTRACE}
    env_file:
      - .env.local
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./migrations
          target: /app/migrations
        - action: rebuild
          path: Cargo.toml

  dev_tunnel:
    image: alpine:3.20
    depends_on:
      - app
    volumes:
      - /home/serg/.ssh/expert_hub_vps:/root/.ssh/expert_hub_vps:ro
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache openssh-client
        mkdir -p /root/.ssh
        exec ssh \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=3 \
          -i /root/.ssh/expert_hub_vps \
          -NT \
          -R 18080:app:8080 \
          root@108.181.246.49
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./scripts/init-dev.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data_dev:
  cargo-cache:
  target-cache: