#docker-compose -f docker-compose.dev.yml --env-file .env.local up -d
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://app_user:dev_password@db:5432/app_db
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
    env_file:
      - .env.local
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./migrations
          target: /app/migrations
        - action: rebuild
          path: Cargo.toml
  ngrok:
    #docker compose -f docker-compose.dev.yml --env-file .env.local up -d ngrok
    image: ngrok/ngrok:latest
    depends_on:
      - app
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: >
      http --url=uncategorical-interradially-dawson.ngrok-free.dev http://app:8080
    restart: unless-stopped


  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=app_db
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./scripts/init-dev.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Optional: Add if you want database UI
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data_dev:
  cargo-cache:
  target-cache: